# v2.1 confirmation (2026-11-27): the v2 models (runs/v2) re-evaluated on the RESERVED fresh test locations; see scripts/run_v21.py
# development = the 80 previously used locations (68 train / 12 val); FRESH test set = the 80 locations never
# downloaded before (manifests/locations_v2.csv), evaluated once at the end.
# Changes vs medium_tuned (motivated by its weaknesses, all selections on validation):
#   longer training (5000 steps), 3 seeds; physics-loss weights x3 (selected on validation earlier);
#   no rate projection (zero violations by construction = over-constraint); guidance scale matched to the
#   OBSERVED envelope-violation rate on validation; post-hoc ensemble spread calibration fitted on validation.
data: {processed_dir: data/processed_v21, locations_file: manifests/locations_v21.csv}
window: {context: 8, horizon: 8, stride: 2, patch: 32}
model: {base_ch: 32, ch_mult: [1, 2, 2], emb_dim: 128, n_res: 1}
diffusion: {timesteps: 1000, ddim_steps: 25}
train: {batch_size: 32, steps: 5000, threads: 4, val_every: 1000, ckpt_every: 500, runs_preset: v2}
physics: {lambda_rate: 3.0, lambda_phen: 1.5, lambda_mono: 3.0, projection_rate: false, rate_percentile: 99.5,
          rate_min_frame_valid: 0.95, env_min_frame_valid: 0.8, phen_k: 2.0, mono_eps: 0.01, guidance_scale: 0.01,
          lambda_range: 1.0, use_loss: true, use_guidance: true, use_projection: true, constraints: [rate, phen, mono]}
eval: {n_members: 8, n_eval_windows: 200, seeds: [0, 1, 2]}
