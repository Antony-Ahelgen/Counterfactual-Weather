# Reduced-scale REAL-data run chosen by the project owner on 2026-11-26 (time limit): the 69 locations whose
# Sentinel-2 download had completed, re-split 70/15/15 with the same rule and seed BEFORE any training;
# shorter training (2500 steps), smaller evaluation. Same model architecture as `cpu`.
data: {processed_dir: data/processed_fast, locations_file: manifests/locations_fast.csv}
window: {context: 8, horizon: 8, stride: 2, patch: 32}
model: {base_ch: 32, ch_mult: [1, 2, 2], emb_dim: 128, n_res: 1}
diffusion: {timesteps: 1000, ddim_steps: 25}
train: {batch_size: 32, steps: 2500, threads: 5, val_every: 500, ckpt_every: 500}
eval: {n_members: 8, n_eval_windows: 100, seeds: [0]}
